<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <img src="../Lab8/imagens/deisi-ball.png" />
      <h1>Loja DEISI</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="escolhaProdutos">
        <h2>Selecione os seus Produtos</h2>
        <section class="opcoesBusca">
          <section class="filtro">
            <label for="filtragem">Filtrar</label>
            <select id="filtragem">
              <option value="Todas">Todas as Categorias</option>
              <option value="T-shirts">T-Shirts</option>
              <option value="Caneca">Canecas</option>
              <option value="Meias">Meias</option>
            </select>
          </section>

          <section class="ordem">
            <label for="ordenacao">Ordenar</label>
            <select id="ordenacao">
              <option value="preco">Ordenar pelo Preço</option>
              <option value="precoAsc">Preço Decrescente</option>
              <option value="precoDesc">Preço Crescente</option>
            </select>
          </section>

          <section class="escrita">
            <label for="input">Escreve aqui:</label>
            <section id="escreve">
              <input type="text" id="input" />
            </section>
          </section>
        </section>

        <section id="produtos"></section>
      </section>

      <section class="produtosSelecionados">
        <h2>O teu Cesto</h2>
        <section id="cesto"></section>
      </section>

      <section class="pagamento">
        <p>Custo Total:<span id="precoPorPagar"></span></p>

        <section class="estudante">
          <label for="check">És estudante do DEISI?</label>
          <input type="checkbox" id="check" />
        </section>

        <section class="cupao">
          <label for="desconto">Cupão de desconto:</label>
          <section id="escreveCupao">
            <input type="text" id="desconto" />
          </section>
        </section>

        <button class="comprar">Comprar</button>

        <section class="info"></section>
      </section>
    </main>

    <footer></footer>
    <script src="scripts/script.js"></script>
  </body>
</html>
