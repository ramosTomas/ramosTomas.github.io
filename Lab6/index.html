<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cromos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <h1>Coleção de Cromos</h1>
      <nav class="menu">
        <h2><a href="../index.html">Menu</a></h2>
      </nav>
    </header>
    <main>
      <section id="colecao">
        <h2>A minha coleção</h2>
        <ul></ul>
        <h3>Total de cromos: <span>0</span></h3>
      </section>
      <section id="inserir">
        <h2>Registar novo cromo</h2>
        <form>
          <input id="numero" type="number" placeholder="numero" required />
          <input id="submit" type="submit" value="Registar Cromo" autofocus />
        </form>
      </section>

      <section id="repetidos">
        <h2>Cromos repetidos na minha Coleção:</h2>
        <ul></ul>
        <h3>Total de cromos repetidos: <span>0</span></h3>
      </section>
    </main>
    <footer>2026, ULusófona</footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
